name: "Setup rig and R"
description: >-
  Install rig, the R Installation Manager, and R, and cache rig's cache
  directory.
author: "r-lib"
branding:
  icon: "package"
  color: "blue"

inputs:
  rig-version:
    description: >-
      rig version to install: `latest`, `nightly` (the latest development
      build) or `x.y.z`.
    default: "latest"
  r-version:
    description: >-
      R version, any version spec that `rig add` takes: `release`, `devel`,
      `next`, `oldrel`, `oldrel-N`, `x.y`, `x.y.z`. If empty, the R version
      of `rproj.lock`, then of `renv.lock`, else `release`.
    default: ""
  r-arch:
    description: "Architecture of R on macOS and Windows, passed to `rig add --arch`."
    default: ""
  working-directory:
    description: >-
      Where to look for `rproj.lock` and `renv.lock`, and the base directory
      of `cache-dependency-glob`.
    default: "."
  enable-cache:
    description: >-
      Cache rig's cache directory. `auto` turns it on for GitHub-hosted
      runners, except for release, tag, pull_request_target and workflow_run
      events.
    default: "auto"
  cache-dependency-glob:
    description: "Files whose contents are part of the cache key, one glob per line."
    default: |
      **/DESCRIPTION
      **/rproj.toml
      **/rproj.lock
      **/renv.lock
      **/*.R.lock
  cache-suffix:
    description: "Extra string added to the cache key."
    default: ""
  prune-cache:
    description: >-
      Remove downloaded package files and metadata before saving the cache,
      keep the packages rig built from source.
    default: "true"
  save-cache:
    description: >-
      `auto`: save the cache only on the default branch. `true`: save on any
      branch. `false`: never save. The cache is only saved if the job
      succeeded; to save it after a failure too, use `actions/cache/save`
      with the `cache-dir` and `cache-key` outputs.
    default: "auto"

outputs:
  rig-version:
    description: "The installed rig version."
  rig-path:
    description: "Path of the rig executable."
  r-version:
    description: "The installed R version."
  r-path:
    description: "Path of the R executable."
  library:
    description: "The default package library of the installed R version."
  cache-hit:
    description: "`true` if the cache was restored from an exact key match."
  cache-key:
    description: "The primary cache key."
  cache-dir:
    description: "rig's cache directory, the one that is cached."

runs:
  using: "node24"
  main: "dist/setup/index.mjs"
  post: "dist/save-cache/index.mjs"
  post-if: "success()"
